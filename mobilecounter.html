<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: transparent;
    font-family: Georgia, serif;
    color: #263A2F;
    text-align: center;
  }

  .tracker {
    width: 100%;
    max-width: 240px;
    margin: 15px auto;
    padding: 5px;
    box-sizing: border-box;
  }

  .label {
    font-family: "Cinzel", Georgia, serif;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .title {
    font-family: "Cinzel", Georgia, serif;
    font-size: 16px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 10px;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
  }

  .count {
    font-size: 30px;
    line-height: 1;
    margin-bottom: 5px;
  }

  .goal {
    font-size: 11px;
    letter-spacing: 1px;
  }

  .bar {
    width: 100%;
    height: 4px;
    background: #DED8CC;
    margin: 18px auto 10px;
    overflow: hidden;
  }

  .progress {
    height: 100%;
    background: #C08011;
    width: 0%;
  }

  .percent {
    font-family: "Cinzel", Georgia, serif;
    font-size: 10px;
    letter-spacing: 1.5px;
  }

  .chapter {
    margin-top: 15px;
    font-size: 10px;
    font-style: italic;
  }
</style>
</head>

<body>

<div class="tracker">

  <div class="label">CURRENTLY WRITING</div>

  <div class="title">WHEN THE LAST CALLS</div>

  <div class="subtitle">DEBUT NOVEL</div>

  <div class="count">
    <span id="currentWords">30,122</span>
  </div>

  <div class="goal">
    / 90,000 WORDS
  </div>

  <div class="bar">
    <div class="progress" id="progress"></div>
  </div>

  <div class="percent">
    <span id="percentage">0</span>% COMPLETE
  </div>

  <div class="chapter">
    Chapter 14 • Currently Drafting
  </div>

</div>

<script>
  const currentWords = 30122;
  const goalWords = 90000;

  const percentage = Math.min(
    (currentWords / goalWords) * 100,
    100
  );

  document.getElementById("currentWords").textContent =
    currentWords.toLocaleString();

  document.getElementById("percentage").textContent =
    Math.round(percentage);

  document.getElementById("progress").style.width =
    percentage + "%";
</script>

</body>
</html>
