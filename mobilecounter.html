<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: transparent;
    font-family: Georgia, serif;
    color: #263A2F;
    text-align: center;
  }

  .tracker {
    width: 100%;
    max-width: 110px;
    margin: 6px auto;
    padding: 1px;
    box-sizing: border-box;
  }

  .label {
    font-family: "Cinzel", Georgia, serif;
    font-size: 6px;
    letter-spacing: .8px;
    margin-bottom: 5px;
  }

  .title {
    font-family: "Cinzel", Georgia, serif;
    font-size: 7px;
    letter-spacing: .4px;
    margin-bottom: 2px;
  }

  .subtitle {
    font-size: 5px;
    letter-spacing: .8px;
    margin-bottom: 7px;
  }

  .count {
    font-size: 14px;
    line-height: 1;
    margin-bottom: 2px;
  }

  .goal {
    font-size: 5px;
    letter-spacing: .4px;
  }

  .bar {
    width: 100%;
    height: 2px;
    background: #DED8CC;
    margin: 7px auto 4px;
    overflow: hidden;
  }

  .progress {
    height: 100%;
    background: #C08011;
    width: 0%;
  }

  .percent {
    font-family: "Cinzel", Georgia, serif;
    font-size: 5px;
    letter-spacing: .7px;
  }

  .chapter {
    margin-top: 5px;
    font-size: 5px;
    font-style: italic;
  }
</style>
</head>

<body>

<div class="tracker">

  <div class="label">CURRENTLY WRITING</div>

  <div class="title">WHEN THE LAST CALLS</div>

  <div class="subtitle">DEBUT NOVEL</div>

  <div class="count">
    <span id="currentWords">30,122</span>
  </div>

  <div class="goal">
    / 90,000 WORDS
  </div>

  <div class="bar">
    <div class="progress" id="progress"></div>
  </div>

  <div class="percent">
    <span id="percentage">0</span>% COMPLETE
  </div>

  <div class="chapter">
    Chapter 14 • Currently Drafting
  </div>

</div>

<script>
  const currentWords = 30122;
  const goalWords = 90000;

  const percentage = Math.min(
    (currentWords / goalWords) * 100,
    100
  );

  document.getElementById("currentWords").textContent =
    currentWords.toLocaleString();

  document.getElementById("percentage").textContent =
    Math.round(percentage);

  document.getElementById("progress").style.width =
    percentage + "%";
</script>

</body>
</html>
